# Dedicated namespace for ephemeral sandbox Jobs/Pods only — nothing else
# should run here. The pod-security.kubernetes.io labels turn on the
# built-in Pod Security Admission controller's "restricted" profile
# (Kubernetes 1.25+, no extra webhook needed): any Pod spec that doesn't
# match what k8s_executor.py actually submits (non-root, no added
# capabilities, no privilege escalation, etc.) is rejected at admission
# time — a second, cluster-enforced backstop behind the securityContext
# k8s_executor.py sets on every Job it creates.
apiVersion: v1
kind: Namespace
metadata:
  name: patchlinex-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    patchlinex.io/component: sandbox
