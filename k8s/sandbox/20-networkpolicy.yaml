# Default-deny for every Pod in this namespace, in both directions. The
# runner images (see docker/) ship every toolchain they need baked in at
# build time — pytest, node, etc. — so a sandbox execution needs zero
# network access at run time. If a language runner is ever added that
# genuinely needs it (e.g. hitting a package-mirror to install
# dependencies), add a narrowly-scoped policy for that runner's label
# selector only — never widen this default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: patchlinex-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
# DNS is the one narrow exception — without it, even the minimal in-pod
# script (which does no network I/O itself) is fine, but leaving it fully
# blocked can make Pod bring-up slow/noisy on clusters where kubelet
# health-checking or the container runtime does its own DNS lookups.
# Scoped to UDP/TCP 53 to kube-dns only, egress only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: patchlinex-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
