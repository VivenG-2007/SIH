# Two SEPARATE identities here — don't merge them:
#
# 1. patchlinex-sandbox-runner (in THIS namespace): what the sandbox POD
#    itself runs as. Zero permissions, no RoleBinding, and
#    k8s_executor.py additionally sets automountServiceAccountToken:
#    false on every sandbox Pod — so untrusted patched code never gets a
#    live Kubernetes API token even if something here were misconfigured.
#
# 2. The identity ai_sevices (k8s_executor.py) itself authenticates as
#    when it calls the Kubernetes API to create/poll/delete Jobs. That
#    service account belongs to ai_sevices' OWN Deployment, in whatever
#    namespace ai_sevices runs in (NOT this one) — these manifests don't
#    create it. Replace <AI_SERVICES_NAMESPACE>/<AI_SERVICES_SERVICE_ACCOUNT>
#    below with the real values before applying. The RoleBinding grants
#    that external identity rights ONLY inside patchlinex-sandbox — it has
#    no access to any other namespace and no cluster-scoped permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchlinex-sandbox-runner
  namespace: patchlinex-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patchlinex-sandbox-job-runner
  namespace: patchlinex-sandbox
rules:
  # Create, poll, and delete the ephemeral Jobs this backend runs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # List the Job's Pod to find its name, and read logs off it — never
  # exec/attach, and never write/patch/delete Pods directly (only via
  # deleting their owning Job).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # ConfigMaps carrying the patched file + run.sh harness per execution.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patchlinex-sandbox-job-runner
  namespace: patchlinex-sandbox
subjects:
  - kind: ServiceAccount
    name: <AI_SERVICES_SERVICE_ACCOUNT>       # e.g. ai-sevices
    namespace: <AI_SERVICES_NAMESPACE>        # e.g. patchlinex
roleRef:
  kind: Role
  name: patchlinex-sandbox-job-runner
  apiGroup: rbac.authorization.k8s.io
