name: CI · ai-storage-service

on:
  push:
    branches: [main]
    paths:
      - "services/ai_sevices/**"
      - ".github/workflows/ci-ai-storage-service.yml"
  pull_request:
    paths:
      - "services/ai_sevices/**"
      - ".github/workflows/ci-ai-storage-service.yml"

defaults:
  run:
    working-directory: services/ai_sevices

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No live Mongo/Redis needed — tests use mongomock-motor and app/config.py
    # falls back to safe defaults for every setting the test suite touches
    # (see requirements-dev.txt / pytest.ini), so this job stays dependency-free.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ai_sevices/requirements.txt
            services/ai_sevices/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test
        run: pytest -q
