name: CI · main-service

on:
  push:
    branches: [main]
    paths:
      - "services/main/**"
      - ".github/workflows/ci-main-service.yml"
  pull_request:
    paths:
      - "services/main/**"
      - ".github/workflows/ci-main-service.yml"

defaults:
  run:
    working-directory: services/main

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # src/app.js opens live Redis + BullMQ connections at require-time (see
    # src/config/redis.js and src/config/queue.js), and several test files
    # (health.test.js, githubDisconnect.test.js) transitively require it —
    # without a reachable Redis those connections retry forever and the
    # `node --test` process never exits, so this service's suite needs a
    # real Redis in CI, not just a mocked one.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: services/main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379
