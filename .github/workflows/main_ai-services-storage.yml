# Docs for Azure Web App for Containers: https://github.com/Azure/webapps-deploy

name: Build and deploy Container to Azure Web App - ai-services-storage

on:
  push:
    branches:
      - main
    paths:
      - "services/ai_sevices/**"
      - ".github/workflows/main_ai-services-storage.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ai-services-storage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/ai_sevices
          file: services/ai_sevices/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BE911E7DC7814A4384E42E22E8E067AB || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E5A4A92AE72B467F8C40D011EF320E8E || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F21493950A04196B0D53952FA082F3C || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container Image to Azure Web App
        run: |
          az webapp config container set \
            --name ai-services-storage \
            --container-image-name "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --container-registry-url https://ghcr.io
